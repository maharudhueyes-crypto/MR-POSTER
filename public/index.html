<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Poster Auto-Post</title><script src="https://checkout.razorpay.com/v1/checkout.js">async function st(){$('out').textContent=JSON.stringify(await api('status',{id}),null,2)}
async function cn(){if(confirm('Plan cancel pannanuma?'))$('out').textContent=JSON.stringify(await api('cancel',{id}))}
</script>
<style>body{font-family:system-ui;max-width:560px;margin:auto;padding:16px}input,textarea{width:100%;padding:9px;margin:4px 0 10px;box-sizing:border-box}button{padding:12px 16px;margin:4px 4px 4px 0;border:0;border-radius:8px;background:#e8590c;color:#fff;font-size:15px}img{max-width:100%}</style></head><body>
<h2>Daily Poster Auto-Post</h2><p><b>Starting Package: Rs.759 / month</b> - daily poster + auto post</p>
<input id=name placeholder="Business name"><input id=tag placeholder="Tagline"><textarea id=svc rows=4 placeholder="Services (oru line-ku onnu)"></textarea>
<input id=ph placeholder="Phone"><input id=ad placeholder="Address / website">Brand color <input id=col type=color value="#e8590c">Logo <input id=logo type=file accept="image/*">
Post time (IST) <input id=time type=time value="09:00">
<h4>Social accounts</h4><input id=fbPage placeholder="Facebook Page ID"><input id=igId placeholder="Instagram Business Account ID"><input id=fbToken placeholder="Page Access Token (long-lived)">
<button onclick="save()">Save</button><button onclick="prev()">Preview</button><button onclick="pay()">Pay Rs.759 & Activate</button><button onclick="now()">Post now (test)</button><button onclick="st()">Status</button><button onclick="cn()" style="background:#666">Cancel plan</button>
<pre id=out></pre><img id=img>
<script>
const $=i=>document.getElementById(i);let id=localStorage.getItem('pid')||'',logo='';
$('logo').onchange=e=>{const r=new FileReader();r.onload=()=>logo=r.result;r.readAsDataURL(e.target.files[0])};
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
async function save(){const b={id};['name','tag','svc','ph','ad','col','time','fbPage','igId','fbToken'].forEach(k=>b[k]=$(k).value);if(logo)b.logo=logo;const r=await api('register',b);id=r.id;localStorage.setItem('pid',id);$('out').textContent='Saved'}
async function prev(){await save();const r=await api('preview',{id});$('img').src=r.url+'?'+Date.now();$('out').textContent=r.caption}
async function pay(){await save();const r=await api('subscribe',{id});new Razorpay({key:r.key,subscription_id:r.sub,name:'Daily Poster',description:'Starting Package',handler:()=>$('out').textContent='Payment done. Activation confirm aagum (few seconds).'}).open()}
async function now(){$('out').textContent=JSON.stringify(await api('post-now',{id}))}
async function st(){$('out').textContent=JSON.stringify(await api('status',{id}),null,2)}
async function cn(){if(confirm('Plan cancel pannanuma?'))$('out').textContent=JSON.stringify(await api('cancel',{id}))}
</script></body></html>
